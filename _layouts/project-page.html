---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>

  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <!-- Favicon -->
  {% include head/custom.html %}

  <style>
    body { font-family: 'Noto Sans', sans-serif; }

    .publication-title { font-family: 'Google Sans', sans-serif; }
    .publication-authors { font-family: 'Google Sans', sans-serif; }
    .publication-authors a { color: hsl(204, 86%, 53%) !important; }
    .publication-authors a:hover { text-decoration: underline; }
    .author-block { display: inline-block; }

    .publication-venue {
      color: #555;
      font-weight: bold;
      width: fit-content;
    }

    .publication-video {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 10px;
    }
    .publication-video iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .link-block a {
      margin-top: 5px;
      margin-bottom: 5px;
    }

    .results-carousel .item {
      margin: 5px;
      overflow: hidden;
      border: 1px solid #bbb;
      border-radius: 10px;
      padding: 0;
    }

    .footer { background: #f5f5f5; }
    .footer a { color: #4a4a4a; }
    .footer a:hover { text-decoration: underline; }

    .section-divider {
      border: none;
      border-top: 1px solid #e8e8e8;
      margin: 0;
    }

    .back-link {
      font-size: 0.9rem;
      color: #888;
    }
    .back-link a { color: #888; text-decoration: none; }
    .back-link a:hover { color: #222; text-decoration: underline; }

    .hero.is-light { background: #f8f8f8; }
  </style>
</head>
<body>

<nav class="navbar is-white" role="navigation" aria-label="main navigation" style="border-bottom: 1px solid #eee;">
  <div class="container">
    <div class="navbar-brand">
      <a class="navbar-item back-link" href="{{ site.baseurl }}/">
        &larr; {{ site.name | default: site.title }}
      </a>
    </div>
  </div>
</nav>

{{ content }}

<footer class="footer">
  <div class="container">
    <div class="content has-text-centered">
      <p>
        &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}.
        Website template adapted from <a href="https://nerfies.github.io">Nerfies</a>.
      </p>
    </div>
  </div>
</footer>

</body>
</html>
