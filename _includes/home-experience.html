{% include base_path %}

<ul class="home-pubs">
  {% for item in site.data.experience %}
    <li class="home-pub home-exp__item">
      <div class="home-exp__logo">
        {% if item.logo %}
          <img src="{{ item.logo | prepend: '/images/' | prepend: base_path }}" alt="" />
        {% endif %}
      </div>
      <div class="home-pub__info">
        <p class="home-pub__title">{{ item.org }}</p>
        {% if item.period %}
          <p class="home-pub__venue">{{ item.period }}</p>
        {% endif %}
      </div>
    </li>
  {% endfor %}
</ul>
